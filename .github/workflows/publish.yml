# Publishes n8n-nodes-veefore to npm with a provenance statement.
#
# n8n accepts nodes for verification only when they are published from GitHub
# Actions with provenance (since 1 May 2026), and npm generates provenance only
# from a PUBLIC repository. It runs from
# github.com/veefedtechnologies-coder/n8n-nodes-veefore; the private Veefore
# monorepo keeps the source of truth and is copied here for each release.
#
# Publishing uses npm trusted publishing (OIDC): no token is stored. The
# trusted publisher on npmjs.com names this repository and publish.yml, with
# no environment.
#
# Release: run `npm run release` locally. It lints, builds, bumps the version,
# tags and pushes; the tag triggers this workflow.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
